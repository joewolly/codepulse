name: macOS validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        # v4.1.7; pin prevents a mutable action tag from running in CI.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Clean build
        run: swift package clean

      - name: Build package
        run: swift build --configuration debug

      - name: Run tests
        run: swift test --configuration debug
