name: macOS validation

on:
  push:
    branches:
      - main
      - codex/v0.1-session-foundation
  pull_request:
    branches:
      - main

jobs:
  swiftpm:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Clean build
        run: swift package clean

      - name: Build package
        run: swift build --configuration debug

      - name: Build codepulsectl
        run: swift build --configuration debug --product codepulsectl

      - name: Run tests
        run: swift test --configuration debug

      - name: Package app-only release
        run: ./script/package_release.sh --app-only

      - name: Smoke-launch packaged app
        run: ./script/smoke_release_launch.sh dist/release/CodePulse.app
