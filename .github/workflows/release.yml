name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must use vMAJOR.MINOR.PATCH format: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PLIST_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          BUILD_NUMBER="$(/usr/bin/plutil -extract CFBundleVersion raw Resources/Info.plist)"

          if [[ "$PLIST_VERSION" != "$VERSION" ]]; then
            echo "error: tag $TAG does not match Info.plist version $PLIST_VERSION" >&2
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "error: Info.plist build number must be numeric: $BUILD_NUMBER" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: tagged commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Release tag $TAG matches CodePulse $VERSION (build $BUILD_NUMBER)"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test --configuration debug

      - name: Package release
        run: ./script/package_release.sh

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          DMG="dist/release/CodePulse-${VERSION}.dmg"
          CHECKSUMS="dist/release/checksums.txt"

          [[ -f "$DMG" ]] || { echo "error: missing $DMG" >&2; exit 1; }
          [[ -f "$CHECKSUMS" ]] || { echo "error: missing $CHECKSUMS" >&2; exit 1; }

          EXPECTED_NAME="CodePulse-${VERSION}.dmg"
          RECORDED_NAME="$(sed -n 's/^SHA256 (\(.*\)) = .*$/\1/p' "$CHECKSUMS")"
          RECORDED_SHA="$(sed -n 's/^SHA256 (.*) = \([0-9a-fA-F]\{64\}\)$/\1/p' "$CHECKSUMS")"
          ACTUAL_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"

          [[ "$RECORDED_NAME" == "$EXPECTED_NAME" ]] || {
            echo "error: checksum filename mismatch: $RECORDED_NAME" >&2
            exit 1
          }
          [[ "$RECORDED_SHA" == "$ACTUAL_SHA" ]] || {
            echo "error: checksum mismatch for $DMG" >&2
            exit 1
          }

          echo "Verified SHA-256: $ACTUAL_SHA"

      - name: Create Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${SPARKLE_PRIVATE_KEY_BASE64:-}" ]] || {
            echo "error: SPARKLE_PRIVATE_KEY_BASE64 repository secret is not configured" >&2
            exit 1
          }

          DMG="dist/release/CodePulse-${VERSION}.dmg"
          APPCAST="dist/release/appcast.xml"
          SIGN_UPDATE="$(find .build -type f -name sign_update -perm -111 -print -quit 2>/dev/null || true)"
          [[ -x "$SIGN_UPDATE" ]] || {
            echo "error: Sparkle sign_update tool was not resolved by SwiftPM" >&2
            exit 1
          }

          SIGNATURE_OUTPUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D | "$SIGN_UPDATE" --ed-key-file - "$DMG")"
          SIGNATURE="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          [[ -n "$SIGNATURE" ]] || {
            echo "error: Sparkle did not produce an EdDSA signature" >&2
            exit 1
          }

          LENGTH="$(stat -f%z "$DMG")"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          TAG="${GITHUB_REF_NAME}"
          DOWNLOAD_URL="https://github.com/joewolly/codepulse/releases/download/${TAG}/CodePulse-${VERSION}.dmg"
          RELEASE_URL="https://github.com/joewolly/codepulse/releases/tag/${TAG}"

          cat > "$APPCAST" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="https://sparkle-project.org/xml-namespaces/sparkle">
            <channel>
              <title>CodePulse Updates</title>
              <link>https://github.com/joewolly/codepulse/releases</link>
              <description>CodePulse macOS updates</description>
              <language>en</language>
              <item>
                <title>CodePulse ${VERSION}</title>
                <link>${RELEASE_URL}</link>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure url="${DOWNLOAD_URL}"
                           sparkle:edSignature="${SIGNATURE}"
                           length="${LENGTH}"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          /usr/bin/xmllint --noout "$APPCAST"
          grep -F "<sparkle:version>${BUILD_NUMBER}</sparkle:version>" "$APPCAST" >/dev/null
          grep -F "sparkle:edSignature=\"${SIGNATURE}\"" "$APPCAST" >/dev/null
          echo "Sparkle appcast prepared for CodePulse ${VERSION} (build ${BUILD_NUMBER})"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          DMG="dist/release/CodePulse-${VERSION}.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: GitHub Release $TAG already exists" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$DMG" \
            dist/release/checksums.txt \
            dist/release/appcast.xml \
            --verify-tag \
            --fail-on-no-commits \
            --title "CodePulse $TAG" \
            --generate-notes \
            --latest

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          EXPECTED_DMG="CodePulse-${VERSION}.dmg"
          DOWNLOAD_DIR="$(mktemp -d)"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT

          RELEASE_STATE="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease --jq '.tagName + " " + (.isDraft | tostring) + " " + (.isPrerelease | tostring)')"
          [[ "$RELEASE_STATE" == "$TAG false false" ]] || {
            echo "error: unexpected published release state: $RELEASE_STATE" >&2
            exit 1
          }

          gh release download "$TAG" \
            --dir "$DOWNLOAD_DIR" \
            --pattern "$EXPECTED_DMG" \
            --pattern checksums.txt \
            --pattern appcast.xml

          [[ -f "$DOWNLOAD_DIR/$EXPECTED_DMG" ]] || {
            echo "error: published DMG was not downloaded" >&2
            exit 1
          }
          [[ -f "$DOWNLOAD_DIR/checksums.txt" ]] || {
            echo "error: published checksum file was not downloaded" >&2
            exit 1
          }
          [[ -f "$DOWNLOAD_DIR/appcast.xml" ]] || {
            echo "error: published Sparkle appcast was not downloaded" >&2
            exit 1
          }

          RECORDED_SHA="$(sed -n 's/^SHA256 (.*) = \([0-9a-fA-F]\{64\}\)$/\1/p' "$DOWNLOAD_DIR/checksums.txt")"
          ACTUAL_SHA="$(shasum -a 256 "$DOWNLOAD_DIR/$EXPECTED_DMG" | awk '{print $1}')"
          [[ "$RECORDED_SHA" == "$ACTUAL_SHA" ]] || {
            echo "error: published DMG checksum mismatch" >&2
            exit 1
          }

          cmp dist/release/appcast.xml "$DOWNLOAD_DIR/appcast.xml"
          /usr/bin/xmllint --noout "$DOWNLOAD_DIR/appcast.xml"
          grep -F "releases/download/${TAG}/${EXPECTED_DMG}" "$DOWNLOAD_DIR/appcast.xml" >/dev/null
          grep -F "<sparkle:version>${BUILD_NUMBER}</sparkle:version>" "$DOWNLOAD_DIR/appcast.xml" >/dev/null

          echo "Published release $TAG and Sparkle appcast verified: $ACTUAL_SHA"
