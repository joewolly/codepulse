name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must use vMAJOR.MINOR.PATCH format: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PLIST_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          BUILD_NUMBER="$(/usr/bin/plutil -extract CFBundleVersion raw Resources/Info.plist)"

          if [[ "$PLIST_VERSION" != "$VERSION" ]]; then
            echo "error: tag $TAG does not match Info.plist version $PLIST_VERSION" >&2
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "error: Info.plist build number must be numeric: $BUILD_NUMBER" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: tagged commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Release tag $TAG matches CodePulse $VERSION (build $BUILD_NUMBER)"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test --configuration debug

      - name: Package release
        run: ./script/package_release.sh

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          DMG="dist/release/CodePulse-${VERSION}.dmg"
          CHECKSUMS="dist/release/checksums.txt"

          [[ -f "$DMG" ]] || { echo "error: missing $DMG" >&2; exit 1; }
          [[ -f "$CHECKSUMS" ]] || { echo "error: missing $CHECKSUMS" >&2; exit 1; }

          EXPECTED_NAME="CodePulse-${VERSION}.dmg"
          RECORDED_NAME="$(sed -n 's/^SHA256 (\(.*\)) = .*$/\1/p' "$CHECKSUMS")"
          RECORDED_SHA="$(sed -n 's/^SHA256 (.*) = \([0-9a-fA-F]\{64\}\)$/\1/p' "$CHECKSUMS")"
          ACTUAL_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"

          [[ "$RECORDED_NAME" == "$EXPECTED_NAME" ]] || {
            echo "error: checksum filename mismatch: $RECORDED_NAME" >&2
            exit 1
          }
          [[ "$RECORDED_SHA" == "$ACTUAL_SHA" ]] || {
            echo "error: checksum mismatch for $DMG" >&2
            exit 1
          }

          echo "Verified SHA-256: $ACTUAL_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          DMG="dist/release/CodePulse-${VERSION}.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: GitHub Release $TAG already exists" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$DMG" \
            dist/release/checksums.txt \
            --verify-tag \
            --fail-on-no-commits \
            --title "CodePulse $TAG" \
            --generate-notes \
            --latest

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          EXPECTED_DMG="CodePulse-${VERSION}.dmg"
          DOWNLOAD_DIR="$(mktemp -d)"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT

          RELEASE_STATE="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease --jq '.tagName + " " + (.isDraft | tostring) + " " + (.isPrerelease | tostring)')"
          [[ "$RELEASE_STATE" == "$TAG false false" ]] || {
            echo "error: unexpected published release state: $RELEASE_STATE" >&2
            exit 1
          }

          gh release download "$TAG" \
            --dir "$DOWNLOAD_DIR" \
            --pattern "$EXPECTED_DMG" \
            --pattern checksums.txt

          [[ -f "$DOWNLOAD_DIR/$EXPECTED_DMG" ]] || {
            echo "error: published DMG was not downloaded" >&2
            exit 1
          }
          [[ -f "$DOWNLOAD_DIR/checksums.txt" ]] || {
            echo "error: published checksum file was not downloaded" >&2
            exit 1
          }

          RECORDED_SHA="$(sed -n 's/^SHA256 (.*) = \([0-9a-fA-F]\{64\}\)$/\1/p' "$DOWNLOAD_DIR/checksums.txt")"
          ACTUAL_SHA="$(shasum -a 256 "$DOWNLOAD_DIR/$EXPECTED_DMG" | awk '{print $1}')"
          [[ "$RECORDED_SHA" == "$ACTUAL_SHA" ]] || {
            echo "error: published DMG checksum mismatch" >&2
            exit 1
          }

          echo "Published release $TAG verified: $ACTUAL_SHA"
