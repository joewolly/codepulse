name: Release preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Synthetic version used only for preflight packaging
        required: true
        default: 0.0.0
      build:
        description: Synthetic numeric build used only for preflight packaging
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Validate synthetic release inputs
        env:
          PREFLIGHT_VERSION: ${{ inputs.version }}
          PREFLIGHT_BUILD: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "error: synthetic version must use MAJOR.MINOR.PATCH" >&2
            exit 1
          }
          [[ "$PREFLIGHT_BUILD" =~ ^[0-9]+$ ]] || {
            echo "error: synthetic build must be numeric" >&2
            exit 1
          }
          {
            echo "CODEPULSE_VERSION=$PREFLIGHT_VERSION"
            echo "CODEPULSE_BUILD=$PREFLIGHT_BUILD"
          } >> "$GITHUB_ENV"

      - name: Check out source
        # v4.1.7; pin prevents a mutable action tag from running in CI.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify preflight workflow safety
        run: ./script/check_release_preflight.sh

      - name: Run tests
        run: swift test --configuration debug

      - name: Package without publishing
        env:
          CODEPULSE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./script/package_release.sh --adhoc-sign

      - name: Verify generated artifact
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/release/CodePulse-${CODEPULSE_VERSION}.dmg"
          CHECKSUMS="dist/release/checksums.txt"
          [[ -f "$DMG" && -f "$CHECKSUMS" ]]
          EXPECTED_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          grep -F "SHA256 (CodePulse-${CODEPULSE_VERSION}.dmg) = $EXPECTED_SHA" "$CHECKSUMS"
          hdiutil imageinfo "$DMG" >/dev/null

      - name: Validate Sparkle signing with a disposable key
        shell: bash
        run: |
          set -euo pipefail
          SPARKLE_TOOL_DIR=".build/artifacts/sparkle/Sparkle/bin"
          SIGN_UPDATE="$SPARKLE_TOOL_DIR/sign_update"
          [[ -x "$SIGN_UPDATE" ]] || {
            echo "error: expected SwiftPM Sparkle sign_update tool at $SIGN_UPDATE" >&2
            exit 1
          }
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          /usr/bin/openssl rand 32 > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DMG="dist/release/CodePulse-${CODEPULSE_VERSION}.dmg"
          SIGNATURE_OUTPUT="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$DMG")"
          SIGNATURE="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          [[ -n "$SIGNATURE" ]] || {
            echo "error: Sparkle did not produce an EdDSA signature" >&2
            exit 1
          }
          "$SIGN_UPDATE" --verify --ed-key-file "$KEY_FILE" "$DMG" "$SIGNATURE"

      - name: Upload preflight artifacts
        # v4.3.3; pin prevents a mutable action tag from accessing artifacts.
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: codepulse-release-preflight
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
